<!doctype html><meta charset="utf-8"><title>Floorplan sun simulator</title>
<!-- Lightwell with a made-up sun: pick a date and time (the sun's position is worked out for the home's location),
     which way the plan faces, the cloud coverage, the shutters and the lights. It shows the card, home and states
     given by ?card, ?tag, ?home and ?states (tool.js): by default dist/'s card with the example home and its made-up
     states; ?states=states.js for a snapshot of your own (snapshot.sh). Open this file in a browser. -->
<style>
  body { font-family: sans-serif; display: flex; gap: 24px; padding: 16px; margin: 0; }
  .col { width: 420px; } .dark { background: #111; padding: 8px; }
  ha-card { display: block; border-radius: 12px; background: var(--card-background-color, #fff); }
  .dark ha-card { --card-background-color: #1c1c1c; }
</style>
<script>
  customElements.define('ha-card', class extends HTMLElement {});
  customElements.define('ha-icon', class extends HTMLElement {
    connectedCallback() {
      const name = this.getAttribute('icon').replace('mdi:', '');
      this.style.display = 'inline-block';
      const d = document.createElement('div');
      d.style.cssText = `width: var(--mdc-icon-size); height: var(--mdc-icon-size); background: currentColor;
        -webkit-mask: url(https://cdn.jsdelivr.net/npm/@mdi/svg/svg/${name}.svg) center/contain no-repeat`;
      this.appendChild(d);
    }
  });
</script>
<script src="tool.js"></script>
<script src="controls.js"></script>
<script>
  // Without states: everything unknown (lights off), and the sun over Greenwich.
  window.NO_SNAPSHOT = !window.STATES;
  window.STATES = window.STATES || {};
  window.HOME = window.HOME || {latitude: 51.4779, longitude: 0};
</script>
<form id="f"></form>
<div class="col"><div id="light"></div></div>
<div class="col dark"><div id="dark"></div></div>
<script>
  // The controls (src/editor/controls.js) turn the states in use into the states shown; the cards' taps act on them.
  const $ = id => document.getElementById(id);
  let cards = [];
  const controls = LightwellControls.simulatorControls($('f'), {plan: TOOL.plan(), states: STATES, location: HOME,
    noSnapshot: NO_SNAPSHOT, onChange: ({states, north}) => {
      for (const [c, dark] of cards) {
        c.setConfig(TOOL.config({north}));
        c.hass = {states, themes: {darkMode: dark}, callService: controls.callService};
      }
    }});
  cards = [['light', false], ['dark', true]].map(([id, dark]) => {
    const c = TOOL.card$();
    $(id).appendChild(c);
    c.addEventListener('hass-more-info', e => controls.moreInfo(e.detail.entityId));
    return [c, dark];
  });
  controls.update();
</script>
