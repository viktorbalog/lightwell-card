# A studio drawn from a picture of its plan (plan.png) instead of shapes: the picture fills the view, in its own
# pixels, and Lightwell lays its light, furniture and markers over it. In Home Assistant, put the picture under
# /config/www/ and give its URL as /local/plan.png; here the path is relative to the tools' pages.
#
# The picture is 600 × 500 px, and its walls are 20 px thick and 6 m apart, so 100 px are a metre.

view: {x: 0, y: 0, w: 600, h: 500}
units_per_metre: 100

drawing:
  background: {image: ../../example/background/plan.png, rect: [0, 0, 600, 500]}

rooms:
  studio: [[20, 20, 560, 460]]

openings:
  - {wall: top, at: 0, depth: 20, x: 220, w: 160, lo: 0.9, hi: 2.2, room: studio, sky: studio, part: window_1}
  - {wall: left, at: 0, depth: 20, y: 180, h: 140, lo: 0.9, hi: 2.2, room: studio, sky: studio, part: window_2}

furniture:
  sofa: {shape: {rect: [60, 360, 200, 80], rx: 10}, height: 0.8, shadow_room: studio}
  table: {shape: {circle: [330, 250, 50]}, height: 0.75, shadow_room: studio}
  bed: {shape: {rect: [380, 300, 180, 160], rx: 8}, height: 0.5, shadow_room: studio}

lights:
  - entities: [light.studio_lamp]
    shape: [{circle: [300, 380, 50]}]
    over: true
    clip: studio
    pool: {x: 300, y: 380, r: 320, height: 1.5, shadows: [sofa, table, bed]}
    part: lamp_1

markers:
  - {entity: light.studio_lamp, x: 300, y: 380, icon: 'mdi:floor-lamp', tap: toggle, part: lamp_1}
  - {entity: weather.home, x: 90, y: 60, icon: 'mdi:weather-partly-cloudy', label: {attribute: temperature, round: 0, unit: '°'}}

sun:
  # The plan is turned: its top faces north-north-east.
  north: 25
